<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipe • LEGO TECH</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef2ff;
padding:30px;
color:#1e1e1e;
}

.container{
max-width:1300px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#25115f,#4b2bbf);
padding:35px;
border-radius:28px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.header h1{
font-size:45px;
margin-bottom:10px;
}

.header p{
font-size:17px;
opacity:0.9;
}

.header img{
width:180px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.foto{
width:170px;
height:170px;
border-radius:50%;
margin:auto;
overflow:hidden;
background:#dcdcff;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:20px;
border:6px solid #ede7ff;
}

.foto img{
width:100%;
height:100%;
object-fit:cover;
}

.nome{
font-size:28px;
font-weight:700;
color:#311b92;
margin-bottom:10px;
}

.funcao{
background:#ede7ff;
display:inline-block;
padding:8px 18px;
border-radius:30px;
font-size:15px;
font-weight:600;
color:#311b92;
}

.footer{
text-align:center;
margin-top:40px;
opacity:0.7;
}

@media(max-width:800px){

.header{
flex-direction:column;
text-align:center;
gap:20px;
}

.header h1{
font-size:36px;
}

.header img{
width:150px;
}

}

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<div>
<h1>👥 Equipe LEGO TECH</h1>
<p>Integrantes oficiais da equipe FLL.</p>
</div>

<img src="WhatsApp_Image_2026-01-27_at_14.16.23-removebg-preview.png">

</div>

<!-- GRID -->

<div class="grid">

<!-- ALAN -->

<div class="card">

<div class="foto">
<img src="alan.jpeg">
</div>

<div class="nome">
Alan
</div>

<div class="funcao">
Técnico
</div>

</div>

<!-- EDUARDA -->

<div class="card">

<div class="foto">
<img src="duda.jpeg">
</div>

<div class="nome">
Eduarda
</div>

<div class="funcao">
Técnica
</div>

</div>

<!-- NICOLAS -->

<div class="card">

<div class="foto">
<img src="nicolas.jpeg">
</div>

<div class="nome">
Nicolas
</div>

<div class="funcao">
Mentor 
(Design do robô)
</div>

</div>

<!-- ISAAC -->

<div class="card">

<div class="foto">
<img src="isaac.jpeg">
</div>

<div class="nome">
Isaac
</div>

<div class="funcao">
Competidor 
 
</div>
<div class="funcao">
(Design do Robô)
</div>

</div>

<!-- HELO -->

<div class="card">

<div class="foto">
<img src="Helo.jpeg">
</div>

<div class="nome">
Helo
</div>

<div class="funcao">
Mentora
(Projeto/Core Values)
</div>

</div>
</div>

<!-- FOOTER -->

<div class="footer">
LEGO TECH • Sistema Oficial FLL
</div>

</div>

</body>
</html>
