<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evolução do Robô • LEGO TECH</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Biblioteca PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef2ff;
padding:30px;
color:#1e1e1e;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#25115f,#4b2bbf);
padding:35px;
border-radius:28px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.header h1{
font-size:42px;
margin-bottom:10px;
}

.header p{
font-size:17px;
opacity:0.9;
}

.header img{
width:180px;
}

.card{
background:white;
padding:30px;
border-radius:24px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
margin-bottom:25px;
}

.card h2{
color:#311b92;
margin-bottom:20px;
font-size:28px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.input-group{
display:flex;
flex-direction:column;
}

.input-group label{
margin-bottom:8px;
font-weight:600;
}

input, textarea{
padding:14px;
border:none;
border-radius:14px;
background:#f5f5ff;
font-size:15px;
}

textarea{
resize:vertical;
min-height:120px;
}

.botao{
background:#311b92;
color:white;
border:none;
padding:16px;
width:100%;
border-radius:16px;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:0.3s;
margin-top:20px;
}

.botao:hover{
background:#25115f;
}

.preview{
margin-top:20px;
display:flex;
justify-content:center;
}

.preview img{
max-width:320px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.timeline{
margin-top:30px;
}

.timeline-item{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
border-left:8px solid #311b92;
}

.timeline-item h3{
color:#311b92;
margin-bottom:10px;
}

.timeline-item p{
margin-top:10px;
line-height:1.7;
}

.timeline-item img{
max-width:250px;
margin-top:15px;
border-radius:15px;
display:block;
}

.apagar-btn{
background:#dc2626;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
margin-top:15px;
font-weight:600;
transition:0.3s;
}

.apagar-btn:hover{
background:#b91c1c;
}

.footer{
text-align:center;
margin-top:40px;
opacity:0.7;
}

@media(max-width:800px){

.header{
flex-direction:column;
text-align:center;
gap:20px;
}

.header h1{
font-size:34px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div>
<h1>📷 Evolução do Robô</h1>
<p>Registro oficial de melhorias e evolução da equipe LEGO TECH.</p>
</div>

<img src="WhatsApp_Image_2026-01-27_at_14.16.23-removebg-preview.png">

</div>

<div class="card">

<h2>🛠 Nova Evolução</h2>

<div class="grid">

<div class="input-group">
<label>📅 Data</label>
<input type="date" id="data">
</div>

<div class="input-group">
<label>🤖 Versão do robô</label>
<input type="text" id="versao">
</div>

</div>

<br>

<div class="input-group">
<label>🚀 O que mudou?</label>
<textarea id="mudancas"></textarea>
</div>

<br>

<div class="input-group">
<label>⚠ Problemas encontrados</label>
<textarea id="problemas"></textarea>
</div>

<br>

<div class="input-group">
<label>💡 Melhorias realizadas</label>
<textarea id="melhorias"></textarea>
</div>

<br>

<div class="input-group">
<label>📷 Upload de foto</label>
<input type="file" id="foto">
</div>

<div class="preview">
<img id="preview">
</div>

<button class="botao" onclick="salvarEvolucao()">
💾 Salvar Evolução
</button>

</div>

<div class="timeline">

<h2 style="margin-bottom:20px;color:#311b92;">
📈 Histórico de Evolução
</h2>

<div id="historico"></div>

</div>

<div class="footer">
LEGO TECH • Sistema Oficial FLL
</div>

</div>

<script>

const foto = document.getElementById('foto');
const preview = document.getElementById('preview');

let imagemBase64 = '';

foto.addEventListener('change', function(){

const arquivo = this.files[0];

if(arquivo){

const leitor = new FileReader();

leitor.onload = function(e){

imagemBase64 = e.target.result;

preview.src = imagemBase64;

}

leitor.readAsDataURL(arquivo);

}

});

async function salvarEvolucao(){

const data = document.getElementById('data').value;

const versao = document.getElementById('versao').value;

const mudancas = document.getElementById('mudancas').value;

const problemas = document.getElementById('problemas').value;

const melhorias = document.getElementById('melhorias').value;

const evolucao = {

data,
versao,
mudancas,
problemas,
melhorias,
foto: imagemBase64

};

let evolucoes =
JSON.parse(localStorage.getItem('evolucoes')) || [];

evolucoes.push(evolucao);

localStorage.setItem(
'evolucoes',
JSON.stringify(evolucoes)
);

await gerarPDF(evolucao);

alert('Evolução salva com sucesso!');

mostrarHistorico();

limparFormulario();

}

async function gerarPDF(evolucao){

const { jsPDF } = window.jspdf;

const pdf = new jsPDF();

// Fundo do topo
pdf.setFillColor(49,27,146);
pdf.rect(0,0,210,40,'F');

// Título
pdf.setTextColor(255,255,255);
pdf.setFontSize(24);
pdf.text("Evolução do Robô", 20, 22);

pdf.setFontSize(12);
pdf.text("LEGO TECH • Registro Oficial", 20, 30);

// Corpo
pdf.setTextColor(0,0,0);

pdf.setFontSize(16);
pdf.text(`Versão: ${evolucao.versao}`, 20, 55);

pdf.setFontSize(12);

pdf.text(`Data: ${evolucao.data}`, 20, 68);

// Mudanças
pdf.setFillColor(245,245,255);
pdf.roundedRect(15, 75, 180, 35, 5, 5, 'F');

pdf.setFont(undefined, 'bold');
pdf.text("🚀 O que mudou?", 20, 85);

pdf.setFont(undefined, 'normal');

const mudancasTexto =
pdf.splitTextToSize(evolucao.mudancas, 165);

pdf.text(mudancasTexto, 20, 93);

// Problemas
pdf.setFillColor(245,245,255);
pdf.roundedRect(15, 118, 180, 35, 5, 5, 'F');

pdf.setFont(undefined, 'bold');
pdf.text("⚠ Problemas encontrados", 20, 128);

pdf.setFont(undefined, 'normal');

const problemasTexto =
pdf.splitTextToSize(evolucao.problemas, 165);

pdf.text(problemasTexto, 20, 136);

// Melhorias
pdf.setFillColor(245,245,255);
pdf.roundedRect(15, 161, 180, 35, 5, 5, 'F');

pdf.setFont(undefined, 'bold');
pdf.text("💡 Melhorias realizadas", 20, 171);

pdf.setFont(undefined, 'normal');

const melhoriasTexto =
pdf.splitTextToSize(evolucao.melhorias, 165);

pdf.text(melhoriasTexto, 20, 179);

// Foto
if(evolucao.foto){

pdf.setFont(undefined, 'bold');

pdf.text("📷 Foto da evolução", 20, 215);

pdf.addImage(
evolucao.foto,
'JPEG',
20,
220,
80,
60
);

}

// Rodapé
pdf.setFontSize(10);

pdf.setTextColor(120);

pdf.text(
"Documento gerado automaticamente pelo sistema LEGO TECH",
20,
290
);

// Baixar PDF
pdf.save(`Evolucao_${evolucao.versao}.pdf`);

}

function mostrarHistorico(){

const historico =
document.getElementById('historico');

let evolucoes =
JSON.parse(localStorage.getItem('evolucoes')) || [];

historico.innerHTML = '';

evolucoes
.slice()
.reverse()
.forEach((item, index) => {

historico.innerHTML += `

<div class="timeline-item">

<h3>
🤖 Versão ${item.versao}
</h3>

<p>
📅 <strong>Data:</strong>
${item.data}
</p>

<p>
🚀 <strong>Mudanças:</strong><br>
${item.mudancas}
</p>

<p>
⚠ <strong>Problemas:</strong><br>
${item.problemas}
</p>

<p>
💡 <strong>Melhorias:</strong><br>
${item.melhorias}
</p>

${item.foto ? `<img src="${item.foto}">` : ''}

<button class="apagar-btn" onclick="apagarEvolucao(${index})">
🗑 Apagar
</button>

</div>

`;

});

}

function apagarEvolucao(index){

let evolucoes =
JSON.parse(localStorage.getItem('evolucoes')) || [];

const confirmar =
confirm('Deseja apagar esta evolução?');

if(confirmar){

evolucoes.splice(
evolucoes.length - 1 - index,
1
);

localStorage.setItem(
'evolucoes',
JSON.stringify(evolucoes)
);

mostrarHistorico();

}

}

function limparFormulario(){

document.getElementById('data').value = '';
document.getElementById('versao').value = '';
document.getElementById('mudancas').value = '';
document.getElementById('problemas').value = '';
document.getElementById('melhorias').value = '';
document.getElementById('foto').value = '';

preview.src = '';

imagemBase64 = '';

}

mostrarHistorico();

</script>

</body>
</html>
