<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LEGO TECH</title>

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      font-family:Arial;
    }

    .login-box{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
      text-align:center;
    }

    h1{
      color:white;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
      margin-top:10px;
    }

    button:hover{
      background:#1d4ed8;
    }

    #status{
      color:white;
      margin-top:15px;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <h1>LEGO TECH</h1>

    <input type="email" id="email" placeholder="Email">
    
    <input type="password" id="senha" placeholder="Senha">

    <button id="login">
      Entrar
    </button>

    <button id="cadastro">
      Criar conta
    </button>

    <p id="status"></p>

  </div>

  <script type="module" src="firebase.js"></script>

</body>
</html>
