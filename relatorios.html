<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios • LEGO TECH</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== SEU CSS (mantido igual) ===== */

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{background:#eef2ff;padding:30px;color:#1e1e1e;}

.container{max-width:1300px;margin:auto;}

.header{
background:linear-gradient(135deg,#25115f,#4b2bbf);
padding:35px;
border-radius:28px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.15);
margin-bottom:30px;
}

.header h1{font-size:42px;margin-bottom:10px;}
.header p{font-size:18px;opacity:.9;}
.header img{width:220px;}

.topbar{
display:flex;
gap:20px;
margin-bottom:25px;
flex-wrap:wrap;
}

.input-busca{flex:1;min-width:300px;}
.input-busca input{
width:100%;
padding:16px;
border:none;
border-radius:16px;
font-size:16px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.botao-limpar{
padding:16px 25px;
border:none;
border-radius:16px;
background:#d32f2f;
color:white;
font-weight:600;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.btn{
padding:14px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
}

.btn-abrir{background:#311b92;color:white;}
.btn-excluir{background:#ef5350;color:white;}

.upload-box{
background:white;
padding:25px;
border-radius:24px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.upload-box input{
margin-top:10px;
}

.upload-btn{
margin-top:15px;
background:#00a86b;
color:white;
padding:14px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div>
<h1>📄 Relatórios</h1>
<p>Histórico oficial da equipe LEGO TECH.</p>
</div>
<img src="WhatsApp_Image_2026-01-27_at_14.16.23-removebg-preview.png">
</div>

<!-- 🔥 NOVA ABA: UPLOAD MANUAL -->
<div class="upload-box">
<h2>📤 Adicionar PDF manual</h2>

<input type="file" id="pdfInput" accept="application/pdf">
<br>

<button class="upload-btn" id="uploadBtn">
Salvar PDF
</button>
</div>

<div class="topbar">

<div class="input-busca">
<input id="busca" placeholder="Pesquisar relatório...">
</div>

<button class="botao-limpar" id="limparTudo">
🗑 Limpar Tudo
</button>

</div>

<div class="grid" id="lista-relatorios"></div>

</div>

<script>

const lista = document.getElementById('lista-relatorios');
const busca = document.getElementById('busca');
const pdfInput = document.getElementById('pdfInput');

let relatorios =
JSON.parse(localStorage.getItem('relatorios_legotech')) || [];

function salvarLocal(){
localStorage.setItem('relatorios_legotech', JSON.stringify(relatorios));
}

function renderizar(){

lista.innerHTML='';

if(relatorios.length===0){
lista.innerHTML=`
<div class="card">
<h2>Nenhum relatório salvo</h2>
</div>`;
return;
}

relatorios.slice().reverse().forEach((r,index)=>{

lista.innerHTML+=`
<div class="card">
<h2>📄 ${r.nome || 'Relatório FLL'}</h2>

<p>📅 ${r.data || '-'}</p>

<div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap;">
<button class="btn btn-abrir" onclick="abrir(${index})">📂 Abrir</button>
<button class="btn btn-excluir" onclick="excluir(${index})">🗑 Excluir</button>
</div>

</div>`;
});

}

function abrir(index){
const r = relatorios.slice().reverse()[index];
window.open(r.arquivo, '_blank');
}

function excluir(index){
if(!confirm("Excluir?")) return;

let invertido = relatorios.slice().reverse();
invertido.splice(index,1);
relatorios = invertido.reverse();

salvarLocal();
renderizar();
}

// 🔥 UPLOAD MANUAL DE PDF
document.getElementById('uploadBtn').onclick = () => {

const file = pdfInput.files[0];
if(!file){
alert("Selecione um PDF!");
return;
}

const reader = new FileReader();

reader.onload = function(){

relatorios.push({
nome: file.name,
data: new Date().toLocaleString('pt-BR'),
arquivo: reader.result
});

salvarLocal();
renderizar();

alert("PDF salvo com sucesso!");
};

reader.readAsDataURL(file);
};

// limpar tudo
document.getElementById('limparTudo').onclick = () => {
if(confirm("Apagar tudo?")){
localStorage.removeItem('relatorios_legotech');
relatorios = [];
renderizar();
}
};

// busca
busca.addEventListener('input', () => {
const valor = busca.value.toLowerCase();

document.querySelectorAll('.card').forEach(card=>{
card.style.display =
card.innerText.toLowerCase().includes(valor)
? 'block'
: 'none';
});
});

renderizar();

</script>

</body>
</html>
